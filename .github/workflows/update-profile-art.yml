name: Update profile art
"on":
  schedule:
    - cron: "17 6 * * *"   # todos los días ~03:17 (Argentina)
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt

      # "Hi!" en cuadraditos: se genera solo si no existe (ya viene commiteado)
      - name: Hi! card
        if: ${{ hashFiles('assets/ascii-portrait.svg') == '' }}
        run: cd scripts && python make_ascii_svg.py

      - name: Info card
        run: cd scripts && python make_info_card.py

      - name: Contribution heatmap
        run: cd scripts && python fetch_contributions.py && python render_heatmap_svg.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "assets/*.svg data/contributions.json"
